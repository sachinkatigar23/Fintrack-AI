<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinTrack AI - Manage Smarter. Spend Better." />
    <title>FinTrack AI</title>
    <script>
      // Apply the saved theme before React loads (prevents a white flash)
      try {
        var t = localStorage.getItem("fintrack-theme") || "dark";
        document.documentElement.classList.toggle("light", t === "light");
        document.documentElement.classList.toggle("dark", t !== "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
